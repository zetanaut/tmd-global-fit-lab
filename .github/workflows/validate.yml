name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU test environment
        run: |
          python -m pip install 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Test portable contracts and external watchdog
        run: python -m pytest -q
      - name: Validate plans and immutable result records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_repository.py --base "$BASE_SHA"
          else
            python scripts/check_repository.py
          fi

